<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick.ai - TRCAC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;500&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Inter', sans-serif;
      background: #f8faf7;
    }

    #intro {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg,#ff06fb,#000000,#000000,#0fe1f0,#000000);
      background-size: 400% 400%;
      animation: gradientMove 20s ease infinite alternate;
      z-index: 998;
      overflow: hidden;
    }

    @keyframes gradientMove {
      0% { background-position:0% 50%; }
      50% { background-position:100% 50%; }
      100% { background-position:0% 50%; }
    }

    #waves {
      position: absolute; left: 0; bottom: 0;
      width: 100vw; height: 50vh;
      pointer-events: none; z-index: 999;
    }
    .wave path {
      animation: waveanim 6s ease-in-out infinite;
    }
    .wave path:nth-child(2){ animation-delay: 2s; }
    .wave path:nth-child(3){ animation-delay: 4s; }
    @keyframes waveanim {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(18px); }
    }

    #title-wrapper, #subtitle-wrapper {
      display: flex; justify-content: center; align-items: center; flex-wrap: wrap;
      z-index: 1003; text-align: center;
    }

    .letter {
      opacity: 0;
      display: inline-block;
      transform: translateX(-50px);
      animation: slideLetter 0.5s forwards ease-out;
    }

    #title-wrapper .letter {
      font-size: 4rem; color: #000000; font-weight: 800;
      text-shadow: 0 4px 16px #fdfdfd, 0 2px 4px #eee8e8;
      margin: 0 1px;
    }

    #subtitle-wrapper .letter {
      font-size: 1.25rem; color: #f3ebeb; font-weight: 500;
      text-shadow: 0 2px 12px #000000, 0 1px 2px #000000;
      margin: 0 1px;
    }

    @keyframes slideLetter {
      0% { opacity:0; transform: translateX(-50px); }
      100% { opacity:1; transform: translateX(0); }
    }

    @keyframes fadeOut {
      to { opacity:0; visibility:hidden; transform:translateY(-10px); }
    }
  </style>
</head>
<body>
  <div id="intro">
    <div id="title-wrapper"></div>
    <div id="subtitle-wrapper"></div>
    <div id="waves">
      <svg class="wave" viewBox="0 0 1440 320" width="100%" height="100%" preserveAspectRatio="none">
        <path fill="#a8edea" fill-opacity="1" d="M0,192L80,197.3C160,203,320,213,480,234.7C640,256,800,288,960,282.7C1120,277,1280,235,1360,213.3L1440,192L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320C320,320,160,320,80,320L0,320Z"></path>
        <path fill="#fcb1b1" fill-opacity="0.4" d="M0,160L80,154.7C160,149,320,139,480,144C640,149,800,171,960,176C1120,181,1280,171,1360,165.3L1440,160L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320C320,320,160,320,80,320L0,320Z"></path>
        <path fill="#5040c1" fill-opacity="0.17" d="M0,96L80,80C160,64,320,32,480,53.3C640,75,800,149,960,149.3C1120,149,1280,75,1360,37.3L1440,0L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320C320,320,160,320,80,320L0,320Z"></path>
      </svg>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    const titleWrapper = document.getElementById('title-wrapper');
    const subtitleWrapper = document.getElementById('subtitle-wrapper');
    const titleText = "Quick.ai";
    const subtitleText = "Where Creativity Meets Intelligence";

    // Add letters to title with staggered animation
    titleText.split("").forEach((char,i)=>{
      const span = document.createElement('span');
      span.className = 'letter';
      span.style.animationDelay = `${i*0.15}s`;
      span.textContent = char;
      titleWrapper.appendChild(span);
    });

    // Add letters to subtitle with staggered animation
    subtitleText.split("").forEach((char,i)=>{
      const span = document.createElement('span');
      span.className = 'letter';
      span.style.animationDelay = `${0.5 + i*0.03}s`;
      span.textContent = char;
      subtitleWrapper.appendChild(span);
    });

    // Fade out intro after delay
    const intro = document.getElementById('intro');
    setTimeout(()=>{
      intro.style.animation = 'fadeOut 1s ease forwards';
    }, 3500);

  </script>
</body>
</html>
